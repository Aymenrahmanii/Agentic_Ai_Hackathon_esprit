[project]
name = "afi-agent"
version = "0.1.0"
description = "Multilingual agent for AFI industrial land services (hackathon scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "openai>=3.51.0",
    "pydantic>=2",
    "uvicorn",
]

[project.optional-dependencies]
graph = [
    "neo4j>=6.4.1",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
